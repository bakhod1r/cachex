name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in . prometheus otel zstd redis nats kafka rabbitmq bench; do
            echo "== $m"; (cd "$m" && govulncheck ./...)
          done

  integration:
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: integration
        env:
          MEMCACHED_ADDR: localhost:11211
        run: go test -tags=integration -count=1 ./memcached/

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "prometheus", "otel", "zstd", "redis", "bench", "nats", "kafka", "rabbitmq"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml --build-tags=integration

  prometheus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prometheus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        run: go test -race -count=1 ./...

  otel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        run: go test -race -count=1 ./...

  zstd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zstd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        run: go test -race -count=1 ./...

  bench-vet:
    # bench is a separate module (extra deps); vet only, never run in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet
        run: go vet ./...

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        env:
          REDIS_ADDR: localhost:6379
        run: go test -race -tags=integration -count=1 ./...

  nats:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    defaults:
      run:
        working-directory: nats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        env:
          NATS_URL: nats://localhost:4222
        run: go test -race -tags=integration -count=1 ./...

  kafka:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 10s
    defaults:
      run:
        working-directory: kafka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -race -tags=integration -count=1 ./...

  rabbitmq:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    defaults:
      run:
        working-directory: rabbitmq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        env:
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go test -race -tags=integration -count=1 ./...
